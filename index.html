    <script>
        document.documentElement.dataset.theme = localStorage.getItem('nsh_theme') || 'win-palette';
        // Apply the saved background before first paint (gui.js validates names when switching).
        {
            const wall = localStorage.getItem('nsh_wallpaper');
            if (/^[a-z0-9-]+$/.test(wall || '')) document.documentElement.style.setProperty('--desktop-wall', `url('assets/wallpapers/${wall}.webp')`);
        }
    </script>
